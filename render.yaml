services:
  - type: web
    name: findmypet-agent
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BASE_URL
        sync: false
      - key: PORTKEY_API_KEY
        sync: false
      - key: PORTKEY_MODEL
        sync: false
      - key: PORTKEY_MODEL_GUARDRAIL
        value: "@azure-openai-eus2/gpt-5.6-luna"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: EDGE_SHARED_SECRET
        sync: false
      - key: INGEST_API_KEY
        sync: false
      - key: SESSION_TTL_MINUTES
        value: "60"
      - key: TOP_K_RESULTS
        value: "8"
      - key: SIMILARITY_THRESHOLD
        value: "0.62"
      - key: CHUNK_SIZE
        value: "350"
      - key: CHUNK_OVERLAP
        value: "40"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: LOG_LEVEL
        value: "INFO"
