[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findmypet-agent"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "supabase>=2.10,<3",
  "portkey-ai>=1.7,<2",
  "deepagents>=0.1,<1",
  "tiktoken>=0.8,<1",
  "python-multipart>=0.0.20,<1",
  "slowapi>=0.1.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
